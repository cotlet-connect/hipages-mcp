[project]
name = "hipages-mcp"
version = "1.1.0"
description = "Connect hipages to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No hipages API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["hipages", "hipages api", "hipages mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/hipages?utm_source=pypi&utm_medium=package&utm_campaign=hipages"
Source = "https://github.com/cotlet-connect/hipages-mcp"

[project.scripts]
hipages-mcp = "hipages_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"hipages_agent.py" = "hipages_agent.py"

[tool.hatch.build.targets.sdist]
include = ["hipages_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
